name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

env:
  TF_VERSION: '1.9.5'
  TF_WORKING_DIR: './terraform/infrastructure'
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Prepare auth key
        run: |
          echo '${{ secrets.YC_SA_KEY }}' > ${{ github.workspace }}/terraform/authkey.json

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_cloud_id: b1ghf04gk3pjrsrgql70
          TF_VAR_folder_id: b1gtv0ajanmlin9k1k48
          TF_VAR_sa_key_file: ${{ github.workspace }}/terraform/authkey.json
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_sa_key_file: ${{ github.workspace }}/terraform/authkey.json
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}